name: Publier l'onglet Excel en CSV

on:
  repository_dispatch:
    types: [maj-csv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-csv
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspecter le payload recu
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          {
            echo "### Payload recu"
            echo "Type JSON detecte : **$(printf '%s' "$PAYLOAD" | jq -r 'type')**"
            echo '```json'
            printf '%s' "$PAYLOAD" | head -c 800
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Extraire et ecrire le CSV
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail

          # Gere les deux cas : objet JSON natif OU chaine JSON echappee
          CSV_FIELD=$(printf '%s' "$PAYLOAD" \
            | jq -r 'if type == "string" then (fromjson? // {}) else . end | .csv // empty')

          if [ -z "$CSV_FIELD" ]; then
            echo "::error::Aucun champ 'csv' exploitable dans le client_payload."
            exit 1
          fi

          mkdir -p data

          # Tente un decodage base64 ; bascule en texte brut si ce n'en est pas
          if printf '%s' "$CSV_FIELD" | tr -d '[:space:]' | base64 -d > entourage.csv 2>/dev/null \
             && [ -s entourage.csv ]; then
            echo "Contenu decode depuis base64."
          else
            printf '%s' "$CSV_FIELD" > entourage.csv
            echo "Contenu ecrit en texte brut."
          fi

          echo "Resultat : $(wc -c < entourage.csv) octets, $(wc -l < entourage.csv) lignes"
          echo "--- 3 premieres lignes ---"
          head -3 entourage.csv

      - name: Commiter et pousser
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f entourage.csv
          if git diff --staged --quiet; then
            echo "::warning::Contenu identique au precedent, aucun commit effectue."
          else
            git commit -m "MAJ CSV - $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
            echo "Commit pousse avec succes."
          fi
